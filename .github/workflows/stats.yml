name: Generate Stats

on:
  schedule:
    - cron: "30 5 * * *"
  push:
    branches: [main]
    paths:
      - scripts/gen_stats.py
      - .github/workflows/stats.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stats cards
        env:
          # STATS_TOKEN is a personal token; it includes private contributions per day.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py "${{ github.repository_owner }}" dist

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: stats
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
