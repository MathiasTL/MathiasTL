<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 340" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mathias Torres — AI Engineer. Animated black hole with a glowing accretion disk.">
  <defs>
    <radialGradient id="space" cx="0.27" cy="0.5" r="0.9">
      <stop offset="0%" stop-color="#2b1407"/>
      <stop offset="35%" stop-color="#120905"/>
      <stop offset="100%" stop-color="#050303"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff9a3c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disk" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8e8"/>
      <stop offset="30%" stop-color="#ffd9a0"/>
      <stop offset="60%" stop-color="#f29a45" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#b8521c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7a2e0c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="front">
      <rect x="0" y="168" width="1200" height="172"/>
    </clipPath>
    <clipPath id="frame">
      <rect width="1200" height="340" rx="18"/>
    </clipPath>

    <!-- Bright streaks that orbit the disk; inner ones move faster -->
    <g id="streaks" fill="none" stroke-linecap="round">
      <ellipse cx="330" cy="170" rx="250" ry="27" stroke="#ffb86b" stroke-width="2" stroke-opacity="0.55" pathLength="1000" stroke-dasharray="90 410">
        <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="330" cy="170" rx="200" ry="22" stroke="#ffd59a" stroke-width="2" stroke-opacity="0.7" pathLength="1000" stroke-dasharray="70 260">
        <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="11s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="330" cy="170" rx="150" ry="16" stroke="#fff0d2" stroke-width="2.5" stroke-opacity="0.8" pathLength="1000" stroke-dasharray="60 190">
        <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="330" cy="170" rx="110" ry="12" stroke="#ffffff" stroke-width="2" stroke-opacity="0.85" pathLength="1000" stroke-dasharray="50 200">
        <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="4.5s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#space)"/>

    <!-- Stars -->
    <g fill="#ffe9cc">
      <circle cx="40" cy="30" r="1"/><circle cx="95" cy="290" r="1.2"/><circle cx="150" cy="70" r="0.8"/>
      <circle cx="210" cy="310" r="1"/><circle cx="560" cy="40" r="1.1"/><circle cx="610" cy="300" r="0.9"/>
      <circle cx="700" cy="25" r="0.8"/><circle cx="780" cy="315" r="1"/><circle cx="860" cy="50" r="1.2"/>
      <circle cx="940" cy="290" r="0.8"/><circle cx="1010" cy="35" r="1"/><circle cx="1080" cy="300" r="1.1"/>
      <circle cx="1150" cy="80" r="0.9"/><circle cx="1170" cy="250" r="1"/><circle cx="20" cy="200" r="0.9"/>
      <circle cx="520" cy="250" r="0.7"/><circle cx="1110" cy="160" r="0.8"/><circle cx="480" cy="90" r="0.8"/>
      <circle cx="120" cy="140" r="1.4">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="540" cy="150" r="1.3">
        <animate attributeName="opacity" values="1;0.2;1" dur="4.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="900" cy="140" r="1.4">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1060" cy="230" r="1.2">
        <animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="260" cy="40" r="1.3">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Black hole -->
    <circle cx="330" cy="170" r="185" fill="url(#glow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Far-side streaks, hidden behind the shadow -->
    <use xlink:href="#streaks" href="#streaks"/>

    <!-- Light from the back of the disk, bent over and under the shadow -->
    <ellipse cx="330" cy="170" rx="94" ry="88" fill="none" stroke="#ffbf73" stroke-width="12" filter="url(#halo)">
      <animate attributeName="stroke-opacity" values="0.65;0.95;0.65" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="330" cy="170" rx="76" ry="73" fill="none" stroke="#fff1d6" stroke-width="5" stroke-opacity="0.9" filter="url(#soft)"/>

    <!-- Shadow and photon ring -->
    <circle cx="330" cy="170" r="63" fill="#000"/>
    <circle cx="330" cy="170" r="65" fill="none" stroke="#ffe6bd" stroke-width="1.5" stroke-opacity="0.85"/>

    <!-- Front of the disk, crossing in front of the shadow -->
    <ellipse cx="330" cy="170" rx="275" ry="26" fill="url(#disk)" filter="url(#soft)"/>
    <g clip-path="url(#front)">
      <use xlink:href="#streaks" href="#streaks"/>
    </g>

    <!-- Name and role -->
    <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
      <text x="660" y="140" font-size="58" font-weight="700" fill="#fff1dc" letter-spacing="1">Mathias Torres</text>
      <text x="662" y="184" font-size="23" font-weight="600" fill="#f5a54a">AI Engineer Intern @ InSalud</text>
      <text x="662" y="218" font-size="18" fill="#d9b48a">GenAI · RAG · AI agents in production</text>
      <text x="662" y="250" font-size="15" fill="#a88a6b">Software Engineering · UNMSM · Lima, Perú</text>
    </g>
  </g>
</svg>
