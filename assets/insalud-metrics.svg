<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Impact at InSalud: 10k+ leads per week handled by 8 AI agents; +40% night and weekend bookings vs. the human shift; 20% of lost leads recovered; over 50% less LLM spend.">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5A54A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5A54A"/>
      <stop offset="100%" stop-color="#F5A54A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(0,0)">
      <rect x="1" y="1" width="280" height="168" rx="14" fill="#140b06" stroke="#3a1f0e"/>
      <rect x="40" y="1" width="200" height="2" fill="url(#edge)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="141" y="78" font-size="48" font-weight="700" fill="#F5A54A">10k+</text>
      <text x="141" y="112" font-size="16" fill="#e8c9a3">leads per week</text>
      <text x="141" y="134" font-size="14" fill="#a88a6b">handled by 8 AI agents</text>
    </g>
    <g transform="translate(306,0)">
      <rect x="1" y="1" width="280" height="168" rx="14" fill="#140b06" stroke="#3a1f0e"/>
      <rect x="40" y="1" width="200" height="2" fill="url(#edge)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="141" y="78" font-size="48" font-weight="700" fill="#F5A54A">+40%</text>
      <text x="141" y="112" font-size="16" fill="#e8c9a3">night &amp; weekend bookings</text>
      <text x="141" y="134" font-size="14" fill="#a88a6b">vs. the human shift</text>
    </g>
    <g transform="translate(612,0)">
      <rect x="1" y="1" width="280" height="168" rx="14" fill="#140b06" stroke="#3a1f0e"/>
      <rect x="40" y="1" width="200" height="2" fill="url(#edge)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin="2s" repeatCount="indefinite"/>
      </rect>
      <text x="141" y="78" font-size="48" font-weight="700" fill="#F5A54A">20%</text>
      <text x="141" y="112" font-size="16" fill="#e8c9a3">lost leads recovered</text>
      <text x="141" y="134" font-size="14" fill="#a88a6b">with a Python recontact service</text>
    </g>
    <g transform="translate(918,0)">
      <rect x="1" y="1" width="280" height="168" rx="14" fill="#140b06" stroke="#3a1f0e"/>
      <rect x="40" y="1" width="200" height="2" fill="url(#edge)">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" begin="3s" repeatCount="indefinite"/>
      </rect>
      <text x="141" y="78" font-size="48" font-weight="700" fill="#F5A54A">&gt;50%</text>
      <text x="141" y="112" font-size="16" fill="#e8c9a3">less LLM spend</text>
      <text x="141" y="134" font-size="14" fill="#a88a6b">monitored in production</text>
    </g>
  </g>
</svg>
